name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish to npm via Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write       # para criar commits de versão e tags git
      pull-requests: write  # para abrir o PR "Version Packages"
      id-token: write       # para npm provenance (--provenance)

    steps:
      # A política da enterprise desliga "Allow GitHub Actions to create and approve
      # pull requests", então o GITHUB_TOKEN não consegue abrir o PR "Version Packages".
      # CHANGESETS_GITHUB_TOKEN = fine-grained PAT (Contents: write, Pull requests: write)
      # deste repo. Enquanto o secret não existir, o passo de release é pulado
      # (em vez de falhar) — ver step "Check for release token" abaixo.
      - name: Check for release token
        id: release-token
        env:
          # Não referenciar secrets diretamente em `if:` — usa-se env + output.
          RELEASE_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release pulado::CHANGESETS_GITHUB_TOKEN não configurado neste repositório. A política da enterprise bloqueia o GITHUB_TOKEN padrão de criar/aprovar pull requests, então o Changesets Action não consegue abrir o PR 'Version Packages' (falharia com 'GitHub Actions is not permitted to create or approve pull requests'). Para habilitar o release automático: crie um fine-grained PAT com permissões 'Contents: write' e 'Pull requests: write' neste repositório e salve-o em Settings > Secrets and variables > Actions como CHANGESETS_GITHUB_TOKEN. Este job publicará normalmente assim que o secret existir."
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Token com permissão de criar PR e commitar — necessário para
          # o Changesets Action abrir o "Version Packages" PR
          token: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Configura o registry para publicação autenticada
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        # --no-frozen-lockfile: o `changeset version` bumpa as versões dos
        # package.json mas não regenera o pnpm-lock.yaml; com frozen o install
        # falharia (ERR_PNPM_OUTDATED_LOCKFILE) a cada release.
        run: pnpm install --no-frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build packages (docs tem workflow próprio)
        run: pnpm build --filter=!docs

      # ─── Changesets Action ───────────────────────────────────────────────────
      # Comportamento:
      #   - Se há changesets pendentes em .changeset/:
      #       → Abre (ou atualiza) um PR chamado "Version Packages"
      #         com os bumps de versão e changelogs gerados
      #   - Se o "Version Packages" PR foi mergeado (changesets consumidos):
      #       → Executa `pnpm changeset publish` (publica no npm)
      #       → Cria tags git para cada pacote publicado (ex: @nativeguard/passkey@1.2.0)
      # ────────────────────────────────────────────────────────────────────────
      - name: Create Release PR or Publish to npm
        id: changesets
        if: steps.release-token.outputs.has-token == 'true'
        uses: changesets/action@v1
        with:
          # Comando de publicação — roda apenas quando o PR de versão é mergeado
          publish: pnpm changeset publish --provenance
          # Mensagem do commit de versão gerado pelo changeset
          commit: "chore(release): version packages"
          # Título do PR de versão
          title: "chore(release): version packages"
        env:
          # Token npm com permissão de publicar no escopo @nativeguard.
          # `NPM_TOKEN` é a env que o changesets/action lê para decidir entre
          # token e OIDC trusted publishing — sem ela, ele cai no OIDC (que NÃO
          # cria pacote novo → E404). `NODE_AUTH_TOKEN` alimenta o .npmrc do
          # setup-node. Setamos as duas com o mesmo secret.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      # ─── Notificação de Release ──────────────────────────────────────────────
      # Cria GitHub Release com as notas do changelog para cada pacote publicado
      - name: Get published versions
        id: versions
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "packages=${{ steps.changesets.outputs.publishedPackages }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const packages = JSON.parse('${{ steps.changesets.outputs.publishedPackages }}');
            for (const pkg of packages) {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `${pkg.name}@${pkg.version}`,
                name: `${pkg.name} v${pkg.version}`,
                generate_release_notes: true,
              });
            }
