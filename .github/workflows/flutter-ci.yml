name: Flutter CI

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/flutter/**"
      - ".github/workflows/flutter-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/flutter/**"
      - ".github/workflows/flutter-ci.yml"

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/flutter

jobs:
  analyze-and-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate package (pub publish dry-run)
        run: flutter pub publish --dry-run
