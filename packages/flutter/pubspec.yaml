name: native_passkey_flutter
description: >-
  SDK Flutter híbrido de autenticação WebAuthn/FIDO2 (Passkey) do ecossistema
  Swepay / NativeGuard. Usa passkey nativo (Android Credential Manager / iOS
  ASAuthorization) com fallback automático para WebView.
version: 0.1.2
homepage: https://swepay.github.io/native-passkey-sdk/
repository: https://github.com/swepay/native-passkey-sdk
issue_tracker: https://github.com/swepay/native-passkey-sdk/issues
documentation: https://swepay.github.io/native-passkey-sdk/

topics:
  - passkey
  - webauthn
  - fido2
  - authentication
  - biometrics

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  plugin_platform_interface: ^2.1.8
  flutter_inappwebview: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.nativeguard.passkey
        pluginClass: NativePasskeyPlugin
      ios:
        pluginClass: NativePasskeyPlugin
