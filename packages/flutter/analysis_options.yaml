include: package:flutter_lints/flutter.yaml

analyzer:
  # Mesmos excludes que o `flutter pub get` (>= 3.47) escreveria sozinho; declarados
  # aqui para a árvore ficar limpa no `pub publish --dry-run` do CI.
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Falha o build se houver TODO/FIXME não resolvido em release.
    todo: ignore

linter:
  rules:
    - prefer_final_locals
    - prefer_const_constructors
    - avoid_print
    - public_member_api_docs
